<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Répétition et compréhension : les références des listes</title>
  <desc id="desc">À gauche, les trois éléments de P référencent la même liste. À droite, chaque élément référence une liste distincte.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="480" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="42" fill="#0f172a" font-size="23" font-weight="700">Une liste contient des références vers des objets</text>
    <rect x="24" y="66" width="466" height="390" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="510" y="66" width="466" height="390" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="48" y="103" font-size="14" fill="#9a3412" font-weight="700">RÉPÉTITION · UNE LISTE PARTAGÉE</text>
    <text x="534" y="103" font-size="14" fill="#115e59" font-weight="700">COMPRÉHENSION · TROIS LISTES DISTINCTES</text>
    <g font-family="Consolas, monospace" font-size="20" fill="#0f172a">
      <text x="48" y="143">P = [[0] * n] * n</text>
      <text x="534" y="137" font-size="16">P = [[0 for i in range(n)]</text><text x="534" y="157" font-size="16">     for j in range(n)]</text>
    </g>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
      <rect x="56" y="175" width="94" height="150" rx="9"/>
      <rect x="542" y="175" width="94" height="150" rx="9"/>
      <path d="M56 225 H150 M56 275 H150 M542 225 H636 M542 275 H636"/>
    </g>
    <g font-family="Consolas, monospace" font-size="19" fill="#334155">
      <text x="78" y="206">P[0]</text><text x="78" y="256">P[1]</text><text x="78" y="306">P[2]</text>
      <text x="564" y="206">P[0]</text><text x="564" y="256">P[1]</text><text x="564" y="306">P[2]</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M155 200 C230 200 235 239 307 239"/><path d="M155 250 H307"/><path d="M155 300 C230 300 235 261 307 261"/>
      <path d="M641 200 H793"/><path d="M641 250 H793"/><path d="M641 300 H793"/>
    </g>
    <rect x="317" y="221" width="105" height="58" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <g fill="#ccfbf1" stroke="#0d9488" stroke-width="2">
      <rect x="803" y="179" width="105" height="42" rx="10"/><rect x="803" y="229" width="105" height="42" rx="10"/><rect x="803" y="279" width="105" height="42" rx="10"/>
    </g>
    <g font-family="Consolas, monospace" font-size="15" fill="#0f172a">
      <text x="328" y="258">[0,0,0]</text><text x="814" y="208">[0,0,0]</text><text x="814" y="258">[0,0,0]</text><text x="814" y="308">[0,0,0]</text>
    </g>
    <text x="48" y="365" font-size="17" fill="#9a3412">Après P[0].append(7)</text>
    <text x="534" y="365" font-size="17" fill="#115e59">Après P[0].append(7)</text>
    <g font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">
      <text x="48" y="402">[[7,0,0], [7,0,0], [7,0,0]]</text><text x="534" y="402">[[7,0,0], [0,0,0], [0,0,0]]</text>
    </g>
    <text x="48" y="432" font-size="15" fill="#475569">La modification est visible depuis les trois cases.</text>
    <text x="534" y="432" font-size="15" fill="#475569">Seule la première liste est modifiée.</text>
  </g>
</svg>
